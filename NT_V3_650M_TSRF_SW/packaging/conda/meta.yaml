package:
  name: incfinder
  version: "0.5.0rc2"
source:
  path: ../..
build:
  number: 0
  include_recipe: false
  noarch: python
  script: "{{ PYTHON }} packaging/conda/build.py"
  entry_points:
    - incfinder = ntv3_tsrf.cli:main
requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.11,<3.13
    - numpy 2.4.6
    - scipy 1.17.1
    - scikit-learn 1.9.0
    - joblib 1.5.3
    - pytorch 2.11.0 cpu*
    - transformers 4.57.6
    - huggingface_hub 0.36.0
    - tokenizers 0.22.2
    - safetensors 0.7.0
    - openpyxl 3.1.5
    - packaging >=20
  run_constrained:
    - python <3.13
test:
  imports:
    - incfinder
  commands:
    - incfinder --help
    - incfinder version
about:
  summary: Offline NT-v3 650M two-stage RF Inc typing; research preview
